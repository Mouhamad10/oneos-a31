name: Build OneOS APK (debug) + verify model

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app-android
    env:
      # settings.gradle.kts reads these for the tribalfs GitHub Packages repo.
      GH_PACKAGES_USER: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use the runner's pre-installed Android SDK + add platform 37
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-37" "build-tools;36.0.0" "platform-tools" 2>&1 | tail -5 || \
          "$SM" "platforms;android-36" "build-tools;35.0.0" 2>&1 | tail -5 || true
          echo "installed platforms:"; ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null

      - name: Gradle wrapper version
        run: ./gradlew --version || cat gradle/wrapper/gradle-wrapper.properties

      - name: Verify core:model compiles (contains the A31 profile) + run its tests
        run: ./gradlew :core:model:test --stacktrace --no-daemon 2>&1 | tail -60

      - name: Build the guest manager APK (debug) — required before :app staging
        run: |
          mkdir -p ../switcher/assets || true
          bash ../scripts/build-guest-manager.sh --debug 2>&1 | tail -40
          ls -l ../switcher/assets/guest_manager.apk 2>/dev/null || echo "guest_manager.apk NOT produced"

      - name: Build full debug APK
        id: apk
        continue-on-error: true
        run: |
          ./gradlew :app:assembleFullDebug --stacktrace --no-daemon 2>&1 | tee ../apk-build.log | tail -80

      - name: Locate APK
        run: |
          echo "=== APKs ==="
          find . -name '*.apk' -path '*outputs*' 2>/dev/null | tee ../apk-list.txt
          mkdir -p ../out
          find . -name '*Full*ebug*.apk' -path '*outputs*' -exec cp {} ../out/ \; 2>/dev/null || true
          ls -lh ../out/ 2>/dev/null || echo "(no apk produced)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oneos-apk
          path: |
            out/*.apk
            apk-build.log
            apk-list.txt
